  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightboxBg(event)">
    <div class="lightbox-inner" id="lightbox-inner">
      <div class="lightbox-close" onclick="closeLightbox()">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </div>
    </div>

  <!-- PORTFOLIO CONFIG -->
  <script src="portfolio-config.js"></script>

  <!-- PORTFOLIO LOGIC -->
  <script>
    let currentTab = 'images';
    let currentPage = 0;
    const PER_PAGE = 4;

    function getItems() {
      if (typeof PORTFOLIO === 'undefined') return [];
      return PORTFOLIO[currentTab] || [];
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      currentPage = 0;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid();
    }

    function changePage(dir) {
      const items = getItems();
      const maxPage = Math.max(0, Math.ceil(items.length / PER_PAGE) - 1);
      currentPage = Math.max(0, Math.min(maxPage, currentPage + dir));
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('media-grid');
      const items = getItems();
      const start = currentPage * PER_PAGE;
      const slice = items.slice(start, start + PER_PAGE);
      const total = items.length;
      const maxPage = Math.ceil(total / PER_PAGE);

      document.getElementById('portfolio-count').textContent =
        total > 0 ? `${start + 1}–${Math.min(start + PER_PAGE, total)} / ${total}` : '0 / 0';

      document.getElementById('nav-prev').disabled = currentPage === 0;
      document.getElementById('nav-next').disabled = currentPage >= maxPage - 1 || total === 0;

      grid.innerHTML = '';

      if (total === 0) {
        grid.innerHTML = `
          <div class="media-empty">
            <svg viewBox="0 0 24 24">
              <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3 3.5-4.5 4.5 6H5l3.5-4.5z"/>
            </svg>
            <p>Belum ada ${currentTab === 'images' ? 'gambar' : 'video'}.<br>
            Edit <code>portfolio-config.js</code><br>dan tambahkan ID file Drive-mu.</p>
          </div>`;
        return;
      }

      grid.className = 'media-grid';
      if (slice.length === 1) grid.classList.add('single');
      else if (slice.length === 3) grid.classList.add('triple');

      slice.forEach((item, idx) => {
        const el = document.createElement('div');
        el.className = 'media-item' + (currentTab === 'videos' ? ' video-item' : '');

        if (currentTab === 'images') {
          el.innerHTML = `
            <img
              src="https://lh3.googleusercontent.com/d/${item.id}"
              alt="${item.title || ''}"
              onerror="this.src='https://drive.google.com/thumbnail?id=${item.id}&sz=w400'"
              loading="lazy">
            <div class="play-overlay">
              <svg viewBox="0 0 24 24"><path d="M15.5 12l-7 5V7z"/></svg>
            </div>
            <div class="item-label">${item.title || 'Image ' + (start + idx + 1)}</div>`;
          el.onclick = () => openLightboxImage(item);
        } else {
          el.innerHTML = `
            <img
              src="https://drive.google.com/thumbnail?id=${item.id}&sz=w400"
              alt="${item.title || ''}"
              loading="lazy"
              onerror="this.style.background='rgba(240,237,232,0.05)'">
            <div class="play-overlay">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </div>
            <div class="item-label">${item.title || 'Video ' + (start + idx + 1)}</div>`;
          el.onclick = () => openLightboxVideo(item);
        }

        grid.appendChild(el);
      });
    }

    function openLightboxImage(item) {
      const lb = document.getElementById('lightbox');
      const inner = document.getElementById('lightbox-inner');
      inner.innerHTML = `
        <div class="lightbox-close" onclick="closeLightbox()">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </div>
        <img src="https://lh3.googleusercontent.com/d/${item.id}"
          onerror="this.src='https://drive.google.com/uc?export=view&id=${item.id}'"
          alt="${item.title || ''}">
        <div class="lightbox-title">${item.title || ''}</div>`;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function openLightboxVideo(item) {
      const lb = document.getElementById('lightbox');
      const inner = document.getElementById('lightbox-inner');
      // Use proper Google Drive embed URL with autoplay
      inner.innerHTML = `
        <div class="lightbox-close" onclick="closeLightbox()">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </div>
        <iframe
          src="https://drive.google.com/file/d/${item.id}/preview?rm=minimal"
          allow="autoplay; fullscreen"
          allowfullscreen
          loading="eager"
          sandbox="allow-same-origin allow-scripts allow-popups allow-forms">
        </iframe>
        <div class="lightbox-title">${item.title || ''}</div>`;
      lb.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lb = document.getElementById('lightbox');
      lb.classList.remove('open');
      document.body.style.overflow = '';
      // Stop video by removing iframe src
      const iframe = lb.querySelector('iframe');
      if (iframe) { iframe.src = ''; }
      // Re-render to restore
      setTimeout(() => {
        const inner = document.getElementById('lightbox-inner');
        inner.innerHTML = `<div class="lightbox-close" onclick="closeLightbox()">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </div>`;
      }, 310);
    }

    function closeLightboxBg(e) {
      if (e.target === document.getElementById('lightbox')) closeLightbox();
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    document.addEventListener('DOMContentLoaded', renderGrid);
  </script>

  <!-- MUSIC -->
  <script>
    const audio = document.getElementById('bg-music');
    const disc  = document.getElementById('music-disc');
    const prog  = document.getElementById('music-progress');
    const icon  = document.getElementById('play-icon');
    let playing = true;

    const pausePath = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
    const playPath  = 'M8 5v14l11-7z';

    function toggleMusic() {
      if (playing) {
        audio.pause();
        disc.classList.remove('spinning');
        icon.querySelector('path').setAttribute('d', playPath);
      } else {
        audio.play().catch(() => {});
        disc.classList.add('spinning');
        icon.querySelector('path').setAttribute('d', pausePath);
      }
      playing = !playing;
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) prog.style.width = (audio.currentTime / audio.duration * 100) + '%';
    });

    document.addEventListener('DOMContentLoaded', () => {
      const observer = new MutationObserver(() => {
        const content = document.getElementById('main-content');
        if (content && content.classList.contains('visible')) {
          audio.play().then(() => {
            audio.muted = false;
            playing = true;
            disc.classList.add('spinning');
            icon.querySelector('path').setAttribute('d', pausePath);
          }).catch(() => {});
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('main-content'), { attributes: true });
    });
  </script>

  <!-- LOADER -->
  <script>
    (function () {
      const bar     = document.getElementById('loader-bar');
      const pct     = document.getElementById('loader-percent');
      const loader  = document.getElementById('loader');
      const content = document.getElementById('main-content');
      let tick = 0;
      const duration = 2000, interval = 40, steps = duration / interval;
      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
      const timer = setInterval(() => {
        tick++;
        const progress = Math.min(100, Math.round(easeOut(tick / steps) * 100));
        bar.style.width = progress + '%';
        pct.textContent = progress + '%';
        if (progress >= 100) {
          clearInterval(timer);
          setTimeout(() => {
            loader.classList.add('hidden');
            content.classList.add('visible');
          }, 350);
        }
      }, interval);
    })();
  </script>
<div class="abstract-lines">

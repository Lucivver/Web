  <script>
    const audio = document.getElementById('bg-music');
    const disc  = document.getElementById('music-disc');
    const prog  = document.getElementById('music-progress');
    const icon  = document.getElementById('play-icon');
    let playing = true;

    // Pause SVG path
    const pausePath = 'M6 19h4V5H6v14zm8-14v14h4V5h-4z';
    const playPath  = 'M8 5v14l11-7z';

    function toggleMusic() {
      if (playing) {
        audio.pause();
        disc.classList.remove('spinning');
        icon.querySelector('path').setAttribute('d', playPath);
      } else {
        audio.play().catch(() => {});
        disc.classList.add('spinning');
        icon.querySelector('path').setAttribute('d', pausePath);
      }
      playing = !playing;
    }

    // Update progress bar
    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        prog.style.width = (audio.currentTime / audio.duration * 100) + '%';
      }
    });

    // Auto-play after loader finishes (may be blocked by browser policy)
    document.addEventListener('DOMContentLoaded', () => {
  const observer = new MutationObserver(() => {
    const content = document.getElementById('main-content');

    if (content && content.classList.contains('visible')) {
      audio.play().then(() => {
        // setelah berhasil play → unmute
        audio.muted = false;

        playing = true;
        disc.classList.add('spinning');
        icon.querySelector('path').setAttribute('d', pausePath);
      }).catch(() => {
        console.log("Autoplay diblokir browser");
      });

      observer.disconnect();
    }
  });

  observer.observe(document.getElementById('main-content'), { attributes: true });
});
  </script>

    <script>
    (function () {
      const bar     = document.getElementById('loader-bar');
      const pct     = document.getElementById('loader-percent');
      const loader  = document.getElementById('loader');
      const content = document.getElementById('main-content');

      let tick = 0;
      const duration = 1000;
      const interval = 30;
      const steps = duration / interval;

      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

      const timer = setInterval(() => {
        tick++;
        const t = tick / steps;
        const progress = Math.min(100, Math.round(easeOut(t) * 100));
        bar.style.width = progress + '%';
        pct.textContent = progress + '%';

        if (progress >= 100) {
          clearInterval(timer);
          setTimeout(() => {
            loader.classList.add('hidden');
            content.classList.add('visible');
          }, 350);
        }
      }, interval);
    })();
  </script>
